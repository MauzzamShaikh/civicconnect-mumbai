    <style>
      :root{font-family:'DM Sans',sans-serif;color:#172b35;background:#f5f8fa;font-synthesis:none;text-rendering:optimizeLegibility;-webkit-font-smoothing:antialiased;--blue:#1688e8;--ink:#172b35;--muted:#83929d;--line:#edf1f3;--mint:#eaf7f1}
      *{box-sizing:border-box}body{margin:0}button,input{font:inherit}button{cursor:pointer}.layout{max-width:1370px;margin:auto;min-height:100vh;display:grid;grid-template-columns:245px minmax(440px,650px) minmax(265px,340px);gap:30px;padding:0 30px}.sidebar{position:sticky;top:0;height:100vh;padding:26px 8px 20px 0;display:flex;flex-direction:column}.brand{display:flex;gap:11px;align-items:center;padding:2px 12px 32px;font:800 21px Manrope,sans-serif;letter-spacing:-.7px}.brand-icon{width:40px;height:40px;border-radius:14px;background:#e7f3fd;color:#1688e8;display:grid;place-items:center}.brand-icon svg{width:25px}.brand small{display:block;color:#82939c;font:500 10px 'DM Sans',sans-serif;letter-spacing:1.7px;text-transform:uppercase;margin-top:2px}.nav{display:grid;gap:7px}.nav-item{height:49px;display:flex;align-items:center;gap:17px;padding:0 14px;border-radius:14px;color:#657681;font-size:14px;font-weight:600;text-decoration:none;transition:.18s}.nav-item:hover{background:#edf4fa;color:var(--blue)}.nav-item.active{background:#e9f4fe;color:#1285e5}.nav-item svg,.icon{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.nav-count{margin-left:auto;color:#1285e5;font-size:12px}.write-btn{margin:22px 0 22px 5px;border:0;border-radius:13px;background:var(--blue);color:white;height:48px;font-weight:700;box-shadow:0 6px 15px #1688e830;transition:.2s}.write-btn:hover,.publish:hover{background:#0879d1;transform:translateY(-1px)}.sidebar-bottom{margin-top:auto;border-top:1px solid var(--line);padding-top:17px}.local-card{margin:0 5px 15px;border:1px solid #e7ecef;border-radius:15px;background:#fff;padding:13px}.local-title{font-weight:700;font-size:12px}.local-sub{color:var(--muted);font-size:11px;margin-top:4px}.profile{display:flex;align-items:center;gap:10px;padding:10px 8px}.profile-text{min-width:0;flex:1}.profile-name{font-size:12px;font-weight:700}.profile-handle{color:var(--muted);font-size:11px;margin-top:2px}.avatar{width:40px;height:40px;flex:none;object-fit:cover;border-radius:50%;background:#eaf1f5}.main{border-inline:1px solid var(--line);min-height:100vh;background:#fff}.topbar{position:sticky;top:0;z-index:3;background:#ffffffed;backdrop-filter:blur(15px);height:64px;border-bottom:1px solid var(--line);padding:0 24px;display:flex;align-items:center;justify-content:space-between}.topbar h1{font:800 16px Manrope,sans-serif;letter-spacing:-.25px}.live-pill{border:1px solid #e4ebe9;border-radius:30px;color:#47846b;font-size:10px;font-weight:700;padding:6px 9px;display:flex;gap:6px;align-items:center}.dot{width:6px;height:6px;background:#4caf7a;border-radius:50%}.tabs{height:49px;border-bottom:1px solid var(--line);display:grid;grid-template-columns:1fr 1fr}.tab{border:0;background:white;color:#84929d;font-weight:600;font-size:12px;position:relative}.tab.active{color:#263d4a}.tab.active:after{content:'';position:absolute;bottom:0;height:3px;background:var(--blue);border-radius:4px 4px 0 0;width:38px;left:calc(50% - 19px)}.compose{padding:20px 22px 15px;border-bottom:7px solid #f6f8f9;display:flex;gap:12px}.compose-body{flex:1;min-width:0}.compose textarea{border:0;outline:0;resize:vertical;min-height:55px;width:100%;color:var(--ink);font-size:14px;padding:8px 0}.compose textarea::placeholder{color:#9aa8b0}.compose-tools{display:flex;align-items:center;border-top:1px solid var(--line);padding-top:11px}.compose-tools .tool{border:0;background:transparent;color:#62a6dc;padding:5px 8px;display:flex;gap:6px;align-items:center;font-size:11px}.compose-tools svg{width:17px;height:17px}.compose-spacer{flex:1}.counter{color:#96a3ab;font-size:10px;margin-right:12px}.publish{border:0;background:var(--blue);color:white;font-weight:700;font-size:11px;padding:9px 17px;border-radius:10px;transition:.2s}.post{padding:18px 22px 13px;border-bottom:1px solid var(--line);display:flex;gap:12px;transition:background .15s}.post:hover{background:#fcfdfe}.post-content{flex:1;min-width:0}.post-head{display:flex;align-items:center;gap:6px;flex-wrap:wrap}.post-name{font-size:12px;font-weight:700}.verified{width:14px;height:14px;border-radius:50%;background:#4296de;color:white;font-size:9px;display:inline-grid;place-items:center;font-weight:bold}.post-handle,.post-time{font-size:11px;color:#8a98a1}.post-copy{font-size:13px;line-height:1.65;margin:8px 0 12px;color:#344b56}.post-copy a,.topic-link{color:#1784d8;text-decoration:none}.post-photo{width:100%;height:214px;object-fit:cover;display:block;border:1px solid #e8eef1;border-radius:13px;margin:8px 0 12px}.post-photo.image-park{object-position:center 43%}.topic-tag{display:inline-flex;gap:5px;align-items:center;border:1px solid #dfedee;background:#f4faf9;border-radius:6px;padding:4px 7px;font-size:9px;color:#468779;font-weight:600;margin:-1px 0 13px}.post-actions{display:flex;align-items:center;justify-content:space-between;max-width:440px;color:#8897a0}.action{border:0;background:transparent;padding:3px 4px;display:flex;align-items:center;gap:6px;color:inherit;font-size:10px}.action:hover{color:#2697de}.action svg{width:17px;height:17px}.action.liked{color:#ec6684}.action.reposted{color:#4da97b}.sidebar-right{padding:15px 0 40px}.searchbox{height:43px;border:1px solid #e8edf0;border-radius:12px;background:#f1f4f6;display:flex;align-items:center;gap:9px;padding:0 13px;color:#99a5ad}.searchbox svg{width:16px}.searchbox input{background:transparent;border:0;outline:0;width:100%;font-size:12px;color:var(--ink)}.searchbox input::placeholder{color:#96a3ac}.card{background:#fff;border:1px solid #e9edef;border-radius:16px;margin-top:16px;overflow:hidden}.card-title{padding:16px 16px 11px;font:800 14px Manrope,sans-serif;letter-spacing:-.3px}.ward-card{margin-top:16px;border:0;background:#eef7f2;padding:15px;border-radius:15px}.ward-head{display:flex;align-items:center;justify-content:space-between}.ward-label{font-size:9px;color:#729080;text-transform:uppercase;letter-spacing:1.1px;font-weight:700}.ward-icon{background:#dcefe4;width:28px;height:28px;display:grid;place-items:center;border-radius:9px;color:#529b71}.ward-icon svg{width:16px;height:16px}.ward-card h3{margin:9px 0 4px;font:800 14px Manrope,sans-serif}.ward-card p{margin:0;color:#6f8379;font-size:10px;line-height:1.55}.trending .row{padding:10px 15px;border-top:1px solid #f0f2f4;display:block;text-decoration:none;transition:background .12s}.trending .row:hover{background:#fafbfc}.trend-kicker,.trend-count{font-size:9px;color:#9aa5ab}.trend-name{font-size:12px;font-weight:700;margin:3px 0;color:#30434b}.show-more{display:block;padding:13px 15px;border-top:1px solid #f0f2f4;color:#1886db;font-size:11px;text-decoration:none}.people-row{display:flex;align-items:center;gap:9px;padding:10px 13px;border-top:1px solid #f0f2f4}.people-row .avatar{width:34px;height:34px}.people-copy{flex:1;min-width:0}.people-copy b{font-size:10px;display:block}.people-copy span{font-size:9px;color:#929da5}.follow{border:1px solid #dfe7eb;background:white;color:#344852;border-radius:8px;font-weight:700;font-size:9px;padding:6px 9px}.follow.following{border-color:#bcd8c8;background:#edf7f0;color:#478b62}.event-row{display:flex;gap:10px;padding:12px 14px;border-top:1px solid #f0f2f4}.date-box{width:37px;height:40px;flex:none;background:#eaf4fe;border-radius:9px;display:grid;place-content:center;text-align:center}.date-box b{color:#298bd5;font-size:12px;line-height:1}.date-box span{color:#6b98b9;font-size:8px;text-transform:uppercase;margin-top:3px}.event-copy b{font-size:10px;display:block;line-height:1.45}.event-copy span{font-size:9px;color:#94a0a8;display:block;margin-top:3px}.empty{padding:35px 24px;text-align:center;color:#7d8a94;font-size:12px;line-height:1.7}.mobile-nav{display:none}
      @media(max-width:1120px){.layout{grid-template-columns:215px minmax(430px,1fr);max-width:950px;gap:24px}.sidebar-right{display:none}}
      @media(max-width:680px){.layout{display:block;padding:0;max-width:none}.sidebar{display:none}.main{border:0;min-height:100vh;padding-bottom:65px}.topbar{height:58px;padding:0 17px}.compose{padding:16px 15px 12px}.post{padding:16px 15px 12px}.mobile-nav{display:flex;position:fixed;bottom:0;left:0;right:0;z-index:5;height:59px;background:#ffffffed;backdrop-filter:blur(14px);border-top:1px solid #e8edf0;justify-content:space-around;align-items:center}.mobile-nav a{color:#84949d;text-decoration:none;display:grid;place-items:center;position:relative}.mobile-nav a.active{color:var(--blue)}.mobile-nav svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.post-photo{height:190px}.live-pill{font-size:9px}}
      @media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;transition:none!important}}

  <body>
    <div id="root"></div>
    <script>
      const ico=(name)=>{const p={home:'<path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-6v-7H10v7H4a1 1 0 0 1-1-1z"/>',explore:'<circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/><path d="m13.5 8.5-1 3-3 1 3 1 1 3 1-3 3-1-3-1z"/>',bell:'<path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9"/><path d="M10 21h4"/>',mail:'<rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/>',bookmark:'<path d="M6 4a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v17l-6-4-6 4z"/>',users:'<path d="M16 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="10" cy="7" r="4"/><path d="M20 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/>',user:'<circle cx="12" cy="8" r="4"/><path d="M5 21v-2a7 7 0 0 1 14 0v2"/>',more:'<circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/>',photo:'<rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="m21 15-5-5L5 21"/>',poll:'<path d="M4 19V5m0 14h17"/><path d="M8 15v-3m5 3V6m5 9v-6"/>',calendar:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 11h18"/>',heart:'<path d="M20.8 8.7c0 4.5-8.8 10-8.8 10s-8.8-5.5-8.8-10A4.7 4.7 0 0 1 12 6.4a4.7 4.7 0 0 1 8.8 2.3Z"/>',chat:'<path d="M21 11.5a8.4 8.4 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.4 8.4 0 0 1-3.8-.9L3 21l1.9-5.7a8.4 8.4 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.4 8.4 0 0 1 3.8-.9h.5a8.5 8.5 0 0 1 8 8z"/>',repeat:'<path d="m17 1 4 4-4 4"/><path d="M3 11V9a4 4 0 0 1 4-4h14M7 23l-4-4 4-4"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/>',share:'<path d="M12 16V3m-5 5 5-5 5 5"/><path d="M5 12v7a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-7"/>',pin:'<path d="M20 10c0 5-8 12-8 12S4 15 4 10a8 8 0 1 1 16 0Z"/><circle cx="12" cy="10" r="2.5"/>',spark:'<path d="m12 3 1.9 5.8L20 11l-6.1 2.2L12 19l-1.9-5.8L4 11l6.1-2.2L12 3Z"/><path d="m19 14 1.2 2.8L23 18l-2.8 1.2L19 22l-1.2-2.8L15 18l2.8-1.2z"/>',shield:'<path d="M12 22s8-4 8-11V5l-8-3-8 3v6c0 7 8 11 8 11Z"/><path d="m9 12 2 2 4-4"/>',leaf:'<path d="M20 4c-9 0-15 5-15 11a5 5 0 0 0 5 5c6 0 11-6 10-16Z"/><path d="M5 20c2-5 6-8 11-11"/>',arrow:'<path d="m9 18 6-6-6-6"/>'};return `<svg viewBox="0 0 24 24" aria-hidden="true">${p[name]||p.spark}</svg>`};
      const navItems=[['home','Home'],['explore','Explore'],['bell','Notifications','3'],['mail','Messages'],['bookmark','Bookmarks'],['users','Neighborhood'],['user','Profile'],['more','More']];
      const data=[
        {id:1,name:'Maya Patel',handle:'@mayapatel',time:'18m',verified:true,tag:'Civic update',text:'The shade trees on Oak Street are finally getting their second life 🌱 The neighborhood planting starts this Saturday at 9am. Everyone’s welcome — tools and lemonade provided!',img:'https://images.unsplash.com/photo-1441974231531-c6227db76b6e?auto=format&fit=crop&w=1000&q=85',alt:'Morning sunlight filtering through a leafy green neighborhood park',comments:12,reposts:24,likes:86},
        {id:2,name:'Eastside Library',handle:'@eastside_library',time:'42m',verified:true,tag:'Community',text:'Little reminder that the library is a public living room 📚✨ Free Wi-Fi, free warmth, free books, and friendly faces. We’re open until 8 tonight.' ,comments:8,reposts:17,likes:54},
        {id:3,name:'Jordan Rivera',handle:'@jordanriv',time:'1h',tag:'Local question',text:'Honest question: would a protected bike lane on Willow Ave change how you get around? The city is gathering feedback through Friday. Tell them what you think. #SafeStreets',comments:18,reposts:31,likes:42},
        {id:4,name:'Nia Brooks',handle:'@niabuilds',time:'2h',verified:true,tag:'Good news',text:'Our community pantry just hit 500 neighbors served this month 🥹 Thank you to every person who dropped off a bag, shared a post, or helped someone find us. This is what a caring city looks like.',comments:21,reposts:36,likes:128}
      ];const avatar=(seed)=>`https://i.pravatar.cc/100?img=${seed}`;
      const nav=()=>navItems.map(([icon,label,count])=>`<a href="#${label.toLowerCase()}" class="nav-item ${label==='Home'?'active':''}" data-nav="${label}">${ico(icon)}<span>${label}</span>${count?`<span class="nav-count">${count}</span>`:''}</a>`).join('');
      function render(){document.querySelector('#root').innerHTML=`<div class="layout"><aside class="sidebar"><div class="brand"><div class="brand-icon">${ico('leaf')}</div><div>CivicSocial<small>your town, in the know</small></div></div><nav class="nav">${nav()}</nav><button class="write-btn" onclick="document.querySelector('#draft').focus()">Write a post</button><div class="sidebar-bottom"><div class="local-card"><div class="local-title">${ico('pin')} &nbsp;Riverside District</div><div class="local-sub">Your neighborhood · Change</div></div><div class="profile"><img class="avatar" src="${avatar(12)}" alt="Your profile"><div class="profile-text"><div class="profile-name">Alex Morgan</div><div class="profile-handle">@alexmorgan</div></div>${ico('more')}</div></div></aside><main class="main"><header class="topbar"><h1>Home</h1><span class="live-pill"><i class="dot"></i> YOUR COMMUNITY</span></header><div class="tabs"><button class="tab active" data-feed="For you">For you</button><button class="tab" data-feed="Following">Following</button></div><section class="compose"><img class="avatar" src="${avatar(12)}" alt="Alex Morgan"><div class="compose-body"><textarea id="draft" maxlength="280" placeholder="What’s happening in your neighborhood?" aria-label="Write a post"></textarea><div class="compose-tools"><button class="tool" onclick="document.querySelector('#photo').click()">${ico('photo')} Photo</button><input id="photo" type="file" accept="image/*" hidden onchange="photoFile(this)"><button class="tool" onclick="setDraftTopic('Community poll')">${ico('poll')} Poll</button><button class="tool" onclick="setDraftTopic('Neighborhood event')">${ico('calendar')} Event</button><span class="compose-spacer"></span><span class="counter" id="counter">0/280</span><button class="publish" id="publish">Post</button></div></div></section><section id="feed" aria-live="polite"></section></main><aside class="sidebar-right"><label class="searchbox">${ico('explore')}<input id="search" placeholder="Search your community" aria-label="Search posts"></label><div class="ward-card"><div class="ward-head"><span class="ward-label">YOUR NEIGHBORHOOD</span><span class="ward-icon">${ico('pin')}</span></div><h3>Riverside District</h3><p>Good morning, Alex! There’s a little more happening on your block today.</p></div><section class="card trending"><div class="card-title">Local pulse</div>${[['Civic life','Oak Street planting','186 neighbors talking'],['City hall','Willow Ave bike lane','124 neighbors talking'],['Community','Weekend street market','86 neighbors talking'],['Public spaces','Riverside Park','52 neighbors talking']].map(([a,b,c])=>`<a class="row" href="#${b}"><span class="trend-kicker">${a} · Trending</span><div class="trend-name">${b}</div><span class="trend-count">${c}</span></a>`).join('')}<a class="show-more" href="#explore">See what’s happening ${ico('arrow')}</a></section><section class="card"><div class="card-title">Neighbors to know</div>${[[32,'Leah Kim','Community organizer'],[47,'Mateo Garcia','Local journalist'],[12,'Riverside Library','A space for everyone']].map(([img,name,desc])=>`<div class="people-row"><img class="avatar" src="${avatar(img)}" alt=""><div class="people-copy"><b>${name} ${ico('shield')}</b><span>${desc}</span></div><button class="follow" onclick="toggleFollow(this)">Follow</button></div>`).join('')}<a class="show-more" href="#people">Meet more neighbors ${ico('arrow')}</a></section><section class="card"><div class="card-title">Coming up nearby</div>${[['08','SAT','Oak Street tree planting','9:00 AM · Oak & 3rd'],['12','WED','Open council meeting','6:30 PM · City Hall']].map(([n,d,t,s])=>`<div class="event-row"><div class="date-box"><b>${n}</b><span>${d}</span></div><div class="event-copy"><b>${t}</b><span>${s}</span></div></div>`).join('')}</section></aside></div><nav class="mobile-nav">${[['home','Home'],['explore','Explore'],['bell','Notifications'],['users','Neighborhood'],['user','Profile']].map(([a,b])=>`<a class="${b==='Home'?'active':''}" href="#${b.toLowerCase()}" aria-label="${b}">${ico(a)}</a>`).join('')}</nav>`;renderFeed(data);}
      function renderFeed(posts){const feed=document.querySelector('#feed');if(!posts.length){feed.innerHTML='<div class="empty">No local posts match that search yet.<br>Try another word or be the first to start a conversation.</div>';return}feed.innerHTML=posts.map(p=>`<article class="post"><img class="avatar" src="${p.id===2?avatar(68):avatar(p.id===3?11:p.id===4?49:32)}" alt=""><div class="post-content"><div class="post-head"><span class="post-name">${p.name}</span>${p.verified?'<span class="verified" aria-label="Verified">✓</span>':''}<span class="post-handle">${p.handle}</span><span class="post-time">· ${p.time}</span>${ico('more')}</div><p class="post-copy">${escapeHtml(p.text).replace(/(#[A-Za-z]+)/g,'<a href="#explore">$1</a>')}</p>${p.img?`<img class="post-photo image-park" src="${p.img}" alt="${p.alt}" loading="lazy">`:''}<span class="topic-tag">${ico('pin')}${p.tag}</span><div class="post-actions"><button class="action" onclick="replyTo('${p.name}')">${ico('chat')} ${p.comments}</button><button class="action" onclick="repost(this)">${ico('repeat')} ${p.reposts}</button><button class="action" onclick="like(this)">${ico('heart')} ${p.likes}</button><button class="action" aria-label="Share post" onclick="sharePost()">${ico('share')}</button></div></div></article>`).join('')}
      function escapeHtml(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function like(b){b.classList.toggle('liked');const n=b.lastChild;const val=parseInt(n.textContent,10);n.textContent=` ${val+(b.classList.contains('liked')?1:-1)}`}function repost(b){b.classList.toggle('reposted');const n=b.lastChild;const val=parseInt(n.textContent,10);n.textContent=` ${val+(b.classList.contains('reposted')?1:-1)}`}function toggleFollow(b){const on=b.classList.toggle('following');b.textContent=on?'Following':'Follow'}function replyTo(name){const t=document.querySelector('#draft');t.value=`@${name.replaceAll(' ','')} `;t.focus();counter()}function sharePost(){if(navigator.share)navigator.share({title:'CivicSocial',text:'Join the local conversation on CivicSocial.'}).catch(()=>{});else if(navigator.clipboard)navigator.clipboard.writeText(location.href)}function setDraftTopic(topic){const t=document.querySelector('#draft');t.value=t.value+(t.value?'\n':'')+`[${topic}] `;t.focus();counter()}let imageData='';function photoFile(i){if(i.files[0]){const r=new FileReader;r.onload=()=>{imageData=r.result};r.readAsDataURL(i.files[0])}}function counter(){document.querySelector('#counter').textContent=`${document.querySelector('#draft').value.length}/280`}render();document.querySelector('#draft').addEventListener('input',counter);document.querySelector('#publish').onclick=()=>{const t=document.querySelector('#draft'),text=t.value.trim();if(!text)return t.focus();data.unshift({id:Date.now(),name:'Alex Morgan',handle:'@alexmorgan',time:'now',tag:'Neighbor update',text,img:imageData||'',alt:'Photo shared by Alex Morgan',comments:0,reposts:0,likes:0});imageData='';t.value='';counter();renderFeed(data)};document.querySelector('#search').addEventListener('input',e=>{const q=e.target.value.trim().toLowerCase();renderFeed(data.filter(p=>`${p.name} ${p.handle} ${p.text} ${p.tag}`.toLowerCase().includes(q)))});document.querySelectorAll('[data-feed]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-feed]').forEach(x=>x.classList.remove('active'));b.classList.add('active');const follow=b.dataset.feed==='Following';renderFeed(follow?data.filter(p=>p.verified||p.id===1):data)});document.querySelectorAll('[data-nav]').forEach(a=>a.onclick=e=>{e.preventDefault();document.querySelectorAll('[data-nav]').forEach(n=>n.classList.remove('active'));a.classList.add('active');if(a.dataset.nav==='Home')renderFeed(data);else document.querySelector('#feed').innerHTML=`<div class="empty">${ico('spark')}<br><strong>${a.dataset.nav}</strong><br>Connect with what’s happening in your community.</div>`;document.querySelector('.topbar h1').textContent=a.dataset.nav});
    </script>
  </body>
