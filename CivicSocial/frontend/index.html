<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description"
    content="CivicSocial — Your town, in the conversation. Connect with neighbors, engage with local issues, and make your community better.">
  <meta name="theme-color" content="#000000">
  <meta name="civicsocial-api-url" content="">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <link rel="manifest" href="/manifest.webmanifest">
  <title>CivicSocial — Your town, in the conversation</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Manrope:wght@400;500;600;700;800;900&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>

<body>
  <!-- Auth pages (shown when logged out) -->
  <div id="auth-screen" class="auth-screen hidden">
    <div id="auth-landing"><!-- filled by JS --></div>
  </div>

  <!-- App shell (shown when logged in) -->
  <div id="app-shell" class="app-shell hidden">
    <!-- Left Sidebar -->
    <aside class="sidebar-left" id="sidebar">
      <div class="sidebar-inner">
        <a class="brand" href="#" id="brand-logo" onclick="navigate('home')">
          <div class="brand-mark">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
              <path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z" stroke="currentColor" stroke-width="2.2"
                stroke-linecap="round" stroke-linejoin="round" />
              <path d="M9 22V12h6v10" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"
                stroke-linejoin="round" />
            </svg>
          </div>
          <span class="brand-name">CivicSocial</span>
        </a>

        <nav class="sidenav" id="sidenav">
          <button class="nav-item active" data-page="home" onclick="navigate('home')">
            <span class="nav-icon">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
                <path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z" stroke="currentColor" stroke-width="2"
                  stroke-linecap="round" stroke-linejoin="round" />
                <path d="M9 22V12h6v10" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                  stroke-linejoin="round" />
              </svg>
            </span>
            <span class="nav-label">Home</span>
          </button>
          <button class="nav-item" data-page="explore" onclick="navigate('explore')">
            <span class="nav-icon">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
                <circle cx="11" cy="11" r="8" stroke="currentColor" stroke-width="2" />
                <path d="M21 21l-4.35-4.35" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
              </svg>
            </span>
            <span class="nav-label">Explore</span>
          </button>
          <button class="nav-item" data-page="notifications" onclick="navigate('notifications')">
            <span class="nav-icon" id="notif-icon-wrap">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
                <path d="M18 8A6 6 0 006 8c0 7-3 9-3 9h18s-3-2-3-9" stroke="currentColor" stroke-width="2"
                  stroke-linecap="round" stroke-linejoin="round" />
                <path d="M13.73 21a2 2 0 01-3.46 0" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                  stroke-linejoin="round" />
              </svg>
              <span class="badge" id="notif-badge" style="display:none"></span>
            </span>
            <span class="nav-label">Notifications</span>
          </button>
          <button class="nav-item" data-page="bookmarks" onclick="navigate('bookmarks')">
            <span class="nav-icon">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
                <path d="M19 21l-7-5-7 5V5a2 2 0 012-2h10a2 2 0 012 2z" stroke="currentColor" stroke-width="2"
                  stroke-linecap="round" stroke-linejoin="round" />
              </svg>
            </span>
            <span class="nav-label">Bookmarks</span>
          </button>
          <button class="nav-item" data-page="profile" onclick="navigate('profile')">
            <span class="nav-icon">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
                <path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2" stroke="currentColor" stroke-width="2"
                  stroke-linecap="round" stroke-linejoin="round" />
                <circle cx="12" cy="7" r="4" stroke="currentColor" stroke-width="2" />
              </svg>
            </span>
            <span class="nav-label">Profile</span>
          </button>
          <button class="nav-item" data-page="settings" onclick="navigate('settings')">
            <span class="nav-icon">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
                <circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="2" />
                <path
                  d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-2 2 2 2 0 01-2-2v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83 0 2 2 0 010-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 01-2-2 2 2 0 012-2h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 010-2.83 2 2 0 012.83 0l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 012-2 2 2 0 012 2v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 0 2 2 0 010 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 012 2 2 2 0 01-2 2h-.09a1.65 1.65 0 00-1.51 1z"
                  stroke="currentColor" stroke-width="2" />
              </svg>
            </span>
            <span class="nav-label">Settings</span>
          </button>
        </nav>

        <button class="compose-btn" id="compose-btn" onclick="openCompose()">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
            <path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" />
          </svg>
          <span>Start Conversation</span>
        </button>

        <div class="sidebar-profile" id="sidebar-profile" onclick="navigate('profile')">
          <div class="avatar-sm" id="sidebar-avatar"></div>
          <div class="profile-meta">
            <span class="profile-name" id="sidebar-name"></span>
            <span class="profile-handle" id="sidebar-handle"></span>
          </div>
          <button class="more-btn" onclick="event.stopPropagation(); showProfileMenu()">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
              <circle cx="5" cy="12" r="1.5" fill="currentColor" />
              <circle cx="12" cy="12" r="1.5" fill="currentColor" />
              <circle cx="19" cy="12" r="1.5" fill="currentColor" />
            </svg>
          </button>
        </div>
      </div>
    </aside>

    <!-- Main content -->
    <main class="main-content" id="main-content">
      <!-- Pages rendered here -->
    </main>

    <!-- Right sidebar -->
    <aside class="sidebar-right" id="sidebar-right">
      <div class="sidebar-right-inner">
        <div class="search-box" id="search-box">
          <svg class="search-icon" width="17" height="17" viewBox="0 0 24 24" fill="none">
            <circle cx="11" cy="11" r="8" stroke="currentColor" stroke-width="2" />
            <path d="M21 21l-4.35-4.35" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
          </svg>
          <input type="search" id="global-search" placeholder="Search CivicSocial" autocomplete="off"
            onkeydown="handleSearch(event)">
        </div>
        <div id="right-panel-content"><!-- dynamic --></div>
      </div>
    </aside>

    <!-- Mobile bottom bar -->
    <nav class="mobile-nav" id="mobile-nav">
      <button class="mob-nav-item active" data-page="home" onclick="navigate('home')">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
          <path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round" />
          <path d="M9 22V12h6v10" stroke="currentColor" stroke-width="2" stroke-linecap="round"
            stroke-linejoin="round" />
        </svg>
      </button>
      <button class="mob-nav-item" data-page="explore" onclick="navigate('explore')">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
          <circle cx="11" cy="11" r="8" stroke="currentColor" stroke-width="2" />
          <path d="M21 21l-4.35-4.35" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
        </svg>
      </button>
      <button class="mob-nav-item" data-page="notifications" onclick="navigate('notifications')">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
          <path d="M18 8A6 6 0 006 8c0 7-3 9-3 9h18s-3-2-3-9" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round" />
          <path d="M13.73 21a2 2 0 01-3.46 0" stroke="currentColor" stroke-width="2" stroke-linecap="round"
            stroke-linejoin="round" />
        </svg>
      </button>
      <button class="mob-nav-item" data-page="profile" onclick="navigate('profile')">
        <div class="avatar-sm" id="mobile-avatar" style="width:28px;height:28px;font-size:10px;"></div>
      </button>
    </nav>

    <!-- Mobile FAB -->
    <button class="mobile-fab" onclick="openCompose()">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
        <path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" />
      </svg>
    </button>
  </div>

  <!-- Compose Modal -->
  <div class="modal-overlay hidden" id="compose-modal" onclick="closeComposeOnBackdrop(event)">
    <div class="compose-modal-inner">
      <div class="compose-modal-header">
        <button class="icon-btn close-btn" onclick="closeCompose()">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
            <path d="M18 6L6 18M6 6l12 12" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" />
          </svg>
        </button>
        <span class="compose-title">New post</span>
      </div>
      <div class="compose-body">
        <div class="compose-row">
          <div class="avatar-sm" id="compose-avatar"></div>
          <div class="compose-area">
            <div class="mention-composer">
              <textarea id="compose-text" placeholder="What's happening in your community?" rows="4" maxlength="500"
                oninput="updateCharCount(); handleMentionInput(this)" onkeydown="handleMentionKeydown(event, this)" autocomplete="off"></textarea>
              <div class="mention-suggestions hidden" role="listbox" aria-label="Account suggestions"></div>
            </div>
            <div class="compose-tools">
              <div class="compose-tool-group">
                <button class="tool-btn" title="Add image" onclick="triggerImageUpload()">
                  <svg width="19" height="19" viewBox="0 0 24 24" fill="none">
                    <rect x="3" y="3" width="18" height="18" rx="2" stroke="currentColor" stroke-width="2" />
                    <circle cx="8.5" cy="8.5" r="1.5" fill="currentColor" />
                    <path d="M21 15l-5-5L5 21" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                      stroke-linejoin="round" />
                  </svg>
                </button>
                <button class="tool-btn" title="Add video" onclick="triggerVideoUpload()">
                  <svg width="19" height="19" viewBox="0 0 24 24" fill="none">
                    <rect x="3" y="5" width="13" height="14" rx="2" stroke="currentColor" stroke-width="2" />
                    <path d="m16 10 5-3v10l-5-3" stroke="currentColor" stroke-width="2" stroke-linejoin="round" />
                  </svg>
                </button>
              </div>
              <div class="compose-actions">
                <span class="char-count" id="char-count">500</span>
                <button class="btn-primary" onclick="submitPost()">Post</button>
              </div>
            </div>
          </div>
        </div>
        <input type="file" id="image-upload" accept="image/*" style="display:none" onchange="handleImageUpload(event)">
        <input type="file" id="video-upload" accept="video/*" style="display:none" onchange="handleVideoUpload(event)">
        <div id="image-preview-wrap" class="hidden">
          <div class="image-preview-container">
            <img id="image-preview" alt="preview">
            <button class="remove-image-btn" onclick="removeImage()">×</button>
          </div>
        </div>
        <div id="video-preview-wrap" class="hidden">
          <div class="image-preview-container"><video id="video-preview" controls></video><button
              class="remove-image-btn" onclick="removeVideo()">×</button></div>
        </div>
      </div>
    </div>
  </div>

  <!-- Profile menu popover -->
  <div class="popover hidden" id="profile-menu">
    <button class="popover-item" onclick="navigate('profile'); closeProfileMenu()">View profile</button>
    <button class="popover-item" onclick="navigate('settings'); closeProfileMenu()">Settings</button>
    <div class="popover-divider"></div>
    <button class="popover-item danger" onclick="logout()">Log out <span id="pm-handle"></span></button>
  </div>

  <!-- Toast -->
  <div class="toast" id="toast"></div>

  <script src="app.js"></script>
  <script>
    if ('serviceWorker' in navigator) window.addEventListener('load', async () => {
      const wasControlled = Boolean(navigator.serviceWorker.controller);
      try {
        const registration = await navigator.serviceWorker.register('/service-worker.js', { updateViaCache: 'none' });
        const checkForUpdate = () => { if (document.visibilityState === 'visible') registration.update(); };
        window.addEventListener('focus', checkForUpdate);
        window.addEventListener('online', checkForUpdate);
        document.addEventListener('visibilitychange', checkForUpdate);
        let reloaded = false;
        navigator.serviceWorker.addEventListener('controllerchange', () => {
          if (wasControlled && !reloaded) { reloaded = true; window.location.reload(); }
        });
      } catch (error) {
        console.warn('CivicSocial offline support could not be enabled', error);
      }
    });
  </script>
</body>

</html>
